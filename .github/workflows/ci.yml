name: CI

# PRD §10.7 — the whole gate, on every push to main and every PR targeting it,
# so "done" means the same thing for an agent as it does for a human.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Assert the gate has no escape hatches
        run: |
          if grep -REn -- '--no-[v]erify|continue-on-[e]rror|[|][|][[:space:]]*true' .github/workflows; then
            echo "::error::a gate escape hatch is present under .github/workflows"
            exit 1
          fi
          echo "No gate escape hatches under .github/workflows."

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/workflows/.nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The browser cache is keyed on the version npm actually resolved, not on
      # the range in package.json, so a lockfile bump invalidates it exactly once.
      - name: Resolve the Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [ -z "$version" ]; then
            echo "::error::could not resolve the @playwright/test version from package-lock.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved Playwright $version."

      - name: Restore the Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System libraries live outside the cached browser directory, so they are
      # (re)installed on a cache hit while the ~130MB download is skipped.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm run test

      - name: build
        run: npm run build

      # PRD §9.8 — under 200KB gzipped, fonts excluded. Measured over the
      # dist/assets tree the `build` step just produced and printed to the job
      # summary, pass or fail.
      - name: Assert the bundle budget
        run: |
          cat > "$RUNNER_TEMP/bundle-budget.mjs" <<'BUDGET_EOF'
          import { readdirSync, readFileSync, appendFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          import { join, relative } from 'node:path';

          const BUDGET_BYTES = 200 * 1024;
          const FONT = /\.(?:woff2?|ttf|otf|eot)$/i;
          const ROOT = 'dist/assets';

          function walk(dir) {
            const out = [];
            for (const entry of readdirSync(dir, { withFileTypes: true })) {
              const path = join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(path));
              else if (entry.isFile()) out.push(path);
            }
            return out;
          }

          const rows = [];
          let total = 0;
          for (const path of walk(ROOT).sort()) {
            const name = relative(ROOT, path);
            if (FONT.test(name)) {
              rows.push([name, '—', 'font — excluded by §9.8']);
              continue;
            }
            const bytes = gzipSync(readFileSync(path)).length;
            total += bytes;
            rows.push([name, String(bytes), '']);
          }

          const kib = (n) => (n / 1024).toFixed(1) + ' KiB';
          const over = total > BUDGET_BYTES;
          const verdict = over
            ? '**OVER BUDGET**'
            : 'under budget by ' + kib(BUDGET_BYTES - total);
          const lines = [
            '## Bundle budget (§9.8)',
            '',
            '**' + kib(total) + ' gzipped** of a ' + kib(BUDGET_BYTES) + ' budget — ' + verdict + '.',
            '',
            '| file | gzipped bytes | note |',
            '| --- | ---: | --- |',
            ...rows.map((r) => '| `' + r[0] + '` | ' + r[1] + ' | ' + r[2] + ' |'),
          ];

          console.log(lines.join('\n'));
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          }

          if (over) {
            console.error(
              '::error::gzipped dist/assets is ' + kib(total) + ', over the ' + kib(BUDGET_BYTES) + ' budget',
            );
            process.exit(1);
          }
          BUDGET_EOF
          node "$RUNNER_TEMP/bundle-budget.mjs"

      - name: e2e
        run: npm run e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            coverage/
          if-no-files-found: ignore
          retention-days: 14
